name: Windows tests and release payload
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install torch==2.7.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q
      - run: python scripts/package_update.py
      - uses: actions/upload-artifact@v4
        with:
          name: update-payload
          path: dist/update/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check version tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -ne "v$((Get-Content VERSION).Trim())") { throw 'Version/tag mismatch' }
      - run: python scripts/package_update.py
      - name: Publish update assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist/update/* --generate-notes
